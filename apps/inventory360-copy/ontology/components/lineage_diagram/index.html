<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #root { width: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Minimal vanilla Streamlit <-> component bridge — no build step, no CDN.
// Source: https://discuss.streamlit.io/t/code-snippet-create-components-without-any-frontend-tooling-no-react-babel-webpack-etc/13064
// (the same snippet Streamlit's own no-framework cookiecutter template vendors).
function sendMessageToStreamlitClient(type, data) {
  const outData = Object.assign({ isStreamlitMessage: true, type: type }, data);
  window.parent.postMessage(outData, "*");
}
const Streamlit = {
  setComponentReady: function () {
    sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
  },
  setFrameHeight: function (height) {
    sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: height });
  },
  setComponentValue: function (value) {
    sendMessageToStreamlitClient("streamlit:setComponentValue", { value: value });
  },
  RENDER_EVENT: "streamlit:render",
  events: {
    addEventListener: function (type, callback) {
      window.addEventListener("message", function (event) {
        if (event.data.type === type) {
          event.detail = event.data;
          callback(event);
        }
      });
    },
  },
};

const root = document.getElementById("root");
let lastSvg = null;

function onRender(event) {
  const { svg, selected } = event.detail.args;

  if (svg !== lastSvg) {
    root.innerHTML = svg || "";
    lastSvg = svg;
    root.querySelectorAll("[data-node]").forEach(function (el) {
      el.addEventListener("click", function () {
        const name = el.getAttribute("data-node");
        Streamlit.setComponentValue(name === selected ? null : name);
      });
    });
  }

  // Let the iframe match the SVG's own height (set via viewBox/width=100%).
  window.requestAnimationFrame(function () {
    Streamlit.setFrameHeight(root.scrollHeight + 8);
  });
}

Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
Streamlit.setComponentReady();
Streamlit.setFrameHeight(640);
</script>
</body>
</html>
